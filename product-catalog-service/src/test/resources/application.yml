spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6380

grpc:
  server:
    port: 0

jwt:
  public-key-path: src/test/resources/keys/public-key.pem
  issuer: test-issuer