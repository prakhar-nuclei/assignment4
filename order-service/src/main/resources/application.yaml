spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:order_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  grpc:
    server:
      port: ${GRPC_SERVER_PORT:6567}
      reflection:
        enabled: true


  client:
    channel:
      user-service:
        target: ${USER_SERVICE_GRPC_URL:static://${USER_SERVICE_GRPC_HOST:localhost}:${USER_SERVICE_GRPC_PORT:6565}}

      product-catalog-service:
        target: ${PRODUCT_CATALOG_SERVICE_GRPC_URL:static://${PRODUCT_CATALOG_SERVICE_GRPC_HOST:localhost}:${PRODUCT_CATALOG_SERVICE_GRPC_PORT:6566}}