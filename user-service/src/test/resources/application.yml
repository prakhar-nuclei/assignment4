spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  grpc:
    server:
      port: 6565

jwt:
  private-key-path: src/test/resources/keys/private-key.pem
  public-key-path: src/test/resources/keys/public-key.pem

email:
  encryption-key-path: src/test/resources/encryption/encryption.key
  mac-key-path: src/test/resources/encryption/mac.key
